spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${DATABASE_USERNAME:ecommerce_user}
    password: ${DATABASE_PASSWORD:ecommerce_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

logging:
  level:
    com.ecommerce: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:dev_only_change_me_to_a_long_random_secret_key_32_chars_minimum}
    cookie-secure: false
  frontend:
    url: ${FRONTEND_URL:https://e-shop-e-commerce-web-app.vercel.app}
  backend:
    url: ${BACKEND_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://e-shop-e-commerce-web-app.vercel.app,http://localhost:3000,http://localhost:5173}
