spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${DATABASE_USERNAME:ecommerce_user}
    password: ${DATABASE_PASSWORD:ecommerce_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:Gauravkum1275@gmail.com}
    password: ${MAIL_PASSWORD:dcom ikvv niza hgum}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:K8x9Lm2Qa7Pd1Rs6Yu4Wn0Zc5Tb8Hv3Jk1Mx9Np2Qr6St4Uv7Wy0Za3Bc5De8Fg1}
    cookie-secure: false

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

