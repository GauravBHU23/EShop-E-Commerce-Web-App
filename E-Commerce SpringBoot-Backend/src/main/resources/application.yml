spring:
  application:
    name: ecommerce-backend

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    cookie-name: ${JWT_COOKIE_NAME:access_token}
    cookie-secure: ${JWT_COOKIE_SECURE:false}

  file:
    upload-dir: uploads/

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  backend:
    url: ${BACKEND_URL:http://localhost:8080}

  payment:
    instamojo:
      base-url: ${INSTAMOJO_BASE_URL:https://www.instamojo.com/api/1.1}
      api-key: ${INSTAMOJO_API_KEY:d877cc8f2a6c571addbee451ea9a30be}
      auth-token: ${INSTAMOJO_AUTH_TOKEN:7dca8bd1b69af2b14b709ccbaddb4777}
      salt: ${INSTAMOJO_SALT:8af1ba8267eb436891d6155cb99009d1}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
