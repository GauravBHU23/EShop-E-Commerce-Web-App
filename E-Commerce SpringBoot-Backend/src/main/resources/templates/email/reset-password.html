<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 30px auto; background: #fff;
                 border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #e74c3c; padding: 30px; text-align: center; }
    .header h1 { color: #fff; margin: 0; }
    .body { padding: 30px; }
    .btn { display: inline-block; background: #e74c3c; color: #fff;
           padding: 12px 28px; border-radius: 4px; text-decoration: none;
           font-weight: bold; margin: 16px 0; }
    .warning { background: #fff5f5; border: 1px solid #fcc; padding: 12px;
               border-radius: 4px; color: #c0392b; font-size: 13px; margin-top: 16px; }
    .footer { background: #f9f9f9; padding: 20px; text-align: center; color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>Reset Your Password</h1></div>
    <div class="body">
      <p>Hi <strong th:text="${name}">User</strong>,</p>
      <p>We received a request to reset your password. Click the button below to reset it.</p>
      <a th:href="${resetLink}" class="btn">Reset Password</a>
      <div class="warning">
        <strong>Note:</strong> This link is valid for <strong>1 hour</strong> only.
        If you did not request a password reset, please ignore this email.
      </div>
    </div>
    <div class="footer"><p>© 2025 EShop.</p></div>
  </div>
</body>
</html>
