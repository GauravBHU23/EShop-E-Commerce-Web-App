<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 30px auto; background: #fff;
                 border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #e67e22; padding: 30px; text-align: center; }
    .header h1 { color: #fff; margin: 0; }
    .body { padding: 30px; }
    .status-box { background: #fff8f0; border-left: 4px solid #e67e22;
                  border-radius: 4px; padding: 16px; margin: 16px 0; }
    .footer { background: #f9f9f9; padding: 20px; text-align: center; color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>Order Update</h1></div>
    <div class="body">
      <p>Hi <strong th:text="${name}">User</strong>,</p>
      <p>Your order status has been updated.</p>
      <div class="status-box">
        <p>Order: <strong th:text="${orderNumber}">ORD-12345</strong></p>
        <p>New Status: <strong th:text="${status}">SHIPPED</strong></p>
      </div>
      <p>Log in to your account to track your order.</p>
    </div>
    <div class="footer"><p>© 2025 EShop.</p></div>
  </div>
</body>
</html>
