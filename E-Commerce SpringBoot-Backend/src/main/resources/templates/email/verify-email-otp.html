<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fb;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
                <tr>
                    <td style="padding:32px 32px 16px;">
                        <p style="margin:0 0 12px;font-size:14px;color:#2563eb;font-weight:700;">EShop</p>
                        <h1 style="margin:0 0 12px;font-size:28px;line-height:1.2;">Verify your email</h1>
                        <p style="margin:0 0 20px;font-size:16px;line-height:1.6;color:#475569;">
                            Hi <span th:text="${name}">User</span>, use the OTP below to verify your email address in your profile.
                        </p>
                        <div style="margin:0 0 20px;padding:18px 20px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;text-align:center;">
                            <p style="margin:0 0 8px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#1d4ed8;">Verification OTP</p>
                            <p style="margin:0;font-size:34px;letter-spacing:0.28em;font-weight:800;color:#1e3a8a;" th:text="${otp}">123456</p>
                        </div>
                        <p style="margin:0 0 8px;font-size:15px;color:#475569;">
                            This OTP will expire in <strong th:text="${validMinutes}">10</strong> minutes.
                        </p>
                        <p style="margin:0;font-size:14px;color:#64748b;">
                            If you did not request this verification, you can safely ignore this email.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
