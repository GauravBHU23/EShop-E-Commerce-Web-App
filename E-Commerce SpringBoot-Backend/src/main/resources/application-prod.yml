spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME: Gauravkum1275@gmail.com}
    password: ${MAIL_PASSWORD:dcom ikvv niza hgum}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    cookie-secure: true

  frontend:
    url: ${FRONTEND_URL}

  backend:
    url: ${BACKEND_URL}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  file:
    upload-dir: ${FILE_UPLOAD_DIR:/app/uploads/}

logging:
  level:
    com.ecommerce: INFO
    org.springframework: WARN